<section class="space-y-6">
  <app-page-header title="Mes créneaux" subtitle="Gérez vos disponibilités">
    <app-button actions (click)="editTarget = null; showForm = true">Ajouter un créneau</app-button>
  </app-page-header>
  <app-alert *ngIf="error" variant="destructive" title="Erreur">{{ error }}</app-alert>
  <app-data-table [columns]="columns" [rows]="creneaux.content" [loading]="loading" (rowClick)="onRowClick($event)"></app-data-table>
  <app-pagination [currentPage]="currentPage" [pageSize]="pageSize"
    [totalElements]="creneaux.totalElements" (pageChange)="onPageChange($event)"></app-pagination>
  <app-card *ngIf="showForm">
    <h2 class="mb-4 text-lg font-semibold">{{ editTarget ? 'Modifier le créneau' : 'Ajouter un créneau' }}</h2>
    <app-creneau-form [initialValues]="editTarget" [loading]="saving"
      (formSubmit)="onFormSubmit($event)" (cancelled)="showForm = false; editTarget = null"></app-creneau-form>
  </app-card>
</section>
