<main class="grid min-h-dvh place-items-center bg-[var(--ml-background)] px-5 py-12">
  <section class="w-full max-w-xl rounded-[var(--ml-radius-lg)] border border-[var(--ml-border)] bg-[var(--ml-surface)] p-5 shadow-[var(--ml-shadow-sm)] sm:p-8">
    <div class="py-4 text-center sm:px-6 sm:py-8">
      <span class="mx-auto grid size-14 place-items-center rounded-[var(--ml-radius-lg)] bg-[var(--ml-danger-soft)] text-[var(--ml-danger)]">
        <span class="text-sm font-bold" aria-hidden="true">403</span>
      </span>
      <p class="mt-6 mb-0 text-sm font-semibold uppercase tracking-[0.14em] text-[var(--ml-danger)]">Accès refusé</p>
      <h1 class="mt-3 mb-0 text-3xl font-bold tracking-tight">Permission insuffisante</h1>
      <p class="mx-auto mt-4 mb-0 max-w-md leading-7 text-[var(--ml-text-secondary)]">
        Votre session est valide, mais votre compte ne possède pas le rôle requis pour consulter cette page.
      </p>
      <a routerLink="/" class="mt-8 inline-flex min-h-10 items-center justify-center rounded-[var(--ml-radius-sm)] bg-[var(--ml-primary)] px-4 text-sm font-semibold text-white transition-colors hover:bg-[var(--ml-primary-hover)]">Retour à l’accueil</a>
    </div>
  </section>
</main>
