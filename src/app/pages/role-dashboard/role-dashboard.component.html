<main class="grid min-h-dvh place-items-center bg-slate-50 px-5 py-12">
  <section class="w-full max-w-2xl rounded-3xl border border-slate-200 bg-white p-8 text-center shadow-xl shadow-slate-900/5 sm:p-12">
    <div class="mx-auto grid h-16 w-16 place-items-center rounded-2xl bg-blue-100 text-blue-700"><svg class="h-8 w-8" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3l8 4v5c0 5-3.5 8-8 9-4.5-1-8-4-8-9V7l8-4Z" stroke="currentColor" stroke-width="2"/><path d="M9 12l2 2 4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <p class="mt-6 text-sm font-semibold uppercase tracking-[.18em] text-blue-600">Rôle {{ role }}</p>
    <h1 class="mt-3 text-3xl font-bold">{{ title }}</h1>
    <p class="mx-auto mt-4 max-w-lg leading-7 text-slate-600">Cette page de démonstration confirme que le guard a validé votre authentification et le rôle Keycloak requis.</p>
    <a routerLink="/dashboard" class="mt-8 inline-flex rounded-xl bg-blue-600 px-5 py-3 font-semibold text-white transition hover:bg-blue-700">Retour au tableau de bord</a>
  </section>
</main>
