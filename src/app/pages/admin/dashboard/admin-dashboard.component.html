<section class="space-y-6">
  <app-page-header title="Tableau de bord" subtitle="Vue d'ensemble de la plateforme"></app-page-header>
  <app-skeleton *ngIf="loading" [rows]="2"></app-skeleton>
  <app-alert *ngIf="error" variant="destructive" title="Erreur">{{ error }}</app-alert>
  <div *ngIf="!loading" class="grid gap-4 sm:grid-cols-2">
    <app-stat-card label="Praticiens" [value]="praticienCount" icon="users"></app-stat-card>
    <app-stat-card label="Spécialités" [value]="specialiteCount" icon="tag"></app-stat-card>
  </div>
</section>
