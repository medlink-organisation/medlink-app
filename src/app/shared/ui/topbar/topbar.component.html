<header class="sticky top-0 z-30 flex h-[var(--ml-topbar-height)] items-center border-b border-[var(--ml-border)] bg-[color-mix(in_srgb,var(--ml-surface)_94%,transparent)] px-[var(--ml-page-gutter)] backdrop-blur-md">
  <div class="flex w-full min-w-0 items-center gap-3">
    <button
      type="button"
      class="grid size-10 shrink-0 place-items-center rounded-[var(--ml-radius-sm)] border border-[var(--ml-border)] text-[var(--ml-text-secondary)] hover:bg-[var(--ml-surface-hover)] hover:text-[var(--ml-text-primary)] lg:hidden"
      aria-label="Ouvrir la navigation"
      (click)="menuToggle.emit()">
      <app-icon name="menu" size="20"></app-icon>
    </button>
    <div class="min-w-0 flex-1">
      <app-breadcrumb [items]="breadcrumbs"></app-breadcrumb>
    </div>
    <a
      *ngIf="notificationRoute"
      [routerLink]="notificationRoute"
      class="relative hidden size-10 place-items-center rounded-[var(--ml-radius-sm)] text-[var(--ml-text-muted)] transition-colors hover:bg-[var(--ml-surface-hover)] hover:text-[var(--ml-text-primary)] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[var(--ml-focus-ring)] sm:grid"
      [attr.aria-label]="(unreadCount$ | async) ? 'Notifications non lues : ' + (unreadCount$ | async) : 'Notifications'"
      title="Consulter les notifications">
      <app-icon name="bell" size="19"></app-icon>
      <span
        *ngIf="(unreadCount$ | async) as unreadCount"
        class="notification-count"
        aria-hidden="true">
        {{ unreadCount > 99 ? '99+' : unreadCount }}
      </span>
    </a>
    <app-user-menu [roleLabel]="roleLabel" [profileRoute]="profileRoute"></app-user-menu>
  </div>
</header>
