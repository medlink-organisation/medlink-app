<header class="space-y-3">
  <app-breadcrumb *ngIf="breadcrumbs.length" [items]="breadcrumbs"></app-breadcrumb>
  <div class="flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between">
    <div class="min-w-0">
      <h1 class="ml-page-title mb-0 ml-visually-balanced">{{ title }}</h1>
      <p *ngIf="subtitle" class="mt-2 mb-0 max-w-3xl text-sm text-[var(--ml-text-secondary)] sm:text-base">{{ subtitle }}</p>
    </div>
    <div class="flex shrink-0 flex-wrap items-center gap-2">
      <ng-content select="[secondary-actions]"></ng-content>
      <ng-content select="[actions]"></ng-content>
    </div>
  </div>
</header>
