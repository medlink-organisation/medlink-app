<div
  class="cursor-pointer rounded-lg border-2 border-dashed border-border bg-card p-6 text-center text-card-foreground transition-colors"
  [class.border-primary]="dragOver"
  [class.bg-muted]="dragOver"
  role="button"
  tabindex="0"
  (click)="openFilePicker()"
  (keydown.enter)="openFilePicker()"
  (keydown.space)="openFilePicker(); $event.preventDefault()"
>
  <input #fileInput type="file" [accept]="accept" class="sr-only" (change)="onFileInput($event)" />
  <p class="font-medium">{{ label }}</p>
  <p class="mt-1 text-sm text-muted-foreground">Glissez un fichier ici ou cliquez pour parcourir.</p>
  <p *ngIf="selectedFile" class="mt-3 text-sm">
    {{ selectedFile.name }} <span class="text-muted-foreground">({{ formattedSize }})</span>
  </p>
</div>
