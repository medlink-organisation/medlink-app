<app-form-field [label]="label">
  <input
    appFormControl
    type="date"
    [attr.placeholder]="placeholder || null"
    [attr.min]="min || null"
    [attr.max]="max || null"
    [value]="value"
    [disabled]="disabled"
    (input)="onInput($event)"
    (blur)="markTouched()"
  />
</app-form-field>
