<section class="flex min-h-48 flex-col items-center justify-center rounded-lg border border-border bg-card px-6 py-10 text-center text-card-foreground">
  <span *ngIf="icon" aria-hidden="true" class="mb-3 text-3xl text-muted-foreground">{{ icon }}</span>
  <h2 class="font-semibold">{{ title }}</h2>
  <p *ngIf="description" class="mt-1 max-w-md text-sm text-muted-foreground">{{ description }}</p>
</section>
