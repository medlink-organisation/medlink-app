<section class="flex min-h-52 flex-col items-center justify-center rounded-[var(--ml-radius-lg)] border border-dashed border-[var(--ml-border-strong)] bg-[var(--ml-surface)] px-6 py-10 text-center">
  <span *ngIf="icon" class="mb-4 grid size-12 place-items-center rounded-full bg-[var(--ml-primary-soft)] text-[var(--ml-primary)]">
    <app-icon [name]="icon" size="23"></app-icon>
  </span>
  <h2 class="mb-0 text-base font-semibold">{{ title }}</h2>
  <p *ngIf="description" class="mt-2 mb-0 max-w-md text-sm text-[var(--ml-text-muted)]">{{ description }}</p>
  <app-button *ngIf="actionLabel" class="mt-5" variant="outline" (click)="action.emit()">{{ actionLabel }}</app-button>
</section>
