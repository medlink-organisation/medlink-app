<button
  hlmBtn
  [variant]="variant"
  [size]="size"
  [disabled]="disabled || loading"
  [type]="type"
  [attr.aria-busy]="loading"
>
  <span
    *ngIf="loading"
    class="mr-2 inline-block size-4 animate-spin rounded-full border-2 border-current border-r-transparent"
    aria-hidden="true"
  ></span>
  <ng-content></ng-content>
</button>
