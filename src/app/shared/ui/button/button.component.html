<button
  hlmBtn
  [variant]="primitiveVariant"
  [size]="primitiveSize"
  [disabled]="disabled || loading"
  [type]="type"
  [attr.aria-busy]="loading"
  [attr.aria-label]="ariaLabel || null"
  class="min-h-10 rounded-[var(--ml-radius-sm)] px-4 transition-[background-color,border-color,color,box-shadow,transform] duration-150"
>
  <app-icon *ngIf="loading" name="loader" size="16" class="animate-spin" aria-hidden="true"></app-icon>
  <ng-content></ng-content>
</button>
