<div *ngIf="loading" class="rounded-[var(--ml-radius-lg)] border border-[var(--ml-border)] bg-[var(--ml-surface)] p-4" aria-busy="true" aria-label="Chargement du tableau">
  <app-skeleton [rows]="5" pattern="table"></app-skeleton>
</div>
<app-empty-state *ngIf="!loading && rows.length === 0" icon="search" [title]="emptyLabel" description="Modifiez votre recherche ou vos filtres pour afficher d’autres résultats."></app-empty-state>
<div *ngIf="!loading && rows.length > 0" hlmTableContainer class="ml-scrollbar overflow-x-auto rounded-[var(--ml-radius-lg)] border border-[var(--ml-border)] bg-[var(--ml-surface)] shadow-[var(--ml-shadow-xs)]">
  <table hlmTable class="min-w-[42rem]" aria-label="Résultats">
    <thead hlmTHead>
      <tr hlmTr>
        <th *ngFor="let column of columns" hlmTh scope="col">{{ column.label }}</th>
        <th *ngIf="rowActions.length" hlmTh scope="col" [class]="inlineRowActions ? 'w-40 text-right' : 'w-16 text-right'">Actions</th>
      </tr>
    </thead>
    <tbody hlmTBody>
      <tr *ngFor="let row of rows; let rowIndex = index" hlmTr (click)="selectRow(row)" (keydown.enter)="selectRow(row)" tabindex="0" class="cursor-pointer transition-colors hover:bg-[var(--ml-surface-hover)] focus-visible:bg-[var(--ml-primary-soft)]">
        <td *ngFor="let column of columns" hlmTd>{{ formatCell(row, column) }}</td>
        <td *ngIf="rowActions.length" hlmTd class="relative text-right" (click)="$event.stopPropagation()" (keydown.enter)="$event.stopPropagation()">
          <div *ngIf="inlineRowActions" class="flex flex-wrap justify-end gap-2" role="group" aria-label="Actions de la ligne">
            <button
              *ngFor="let action of rowActions"
              type="button"
              class="table-inline-action"
              [class.table-inline-action--danger]="action.destructive"
              [attr.aria-label]="action.label"
              [attr.title]="action.label"
              (click)="performAction(action, row, $event)">
              <app-icon [name]="action.icon" size="18"></app-icon>
            </button>
          </div>
          <details *ngIf="!inlineRowActions" class="table-actions">
            <summary aria-label="Ouvrir les actions" title="Actions">
              <app-icon name="more" size="18"></app-icon>
            </summary>
            <div class="table-actions__menu" role="menu">
              <button
                *ngFor="let action of rowActions"
                type="button"
                role="menuitem"
                [class.table-actions__danger]="action.destructive"
                (click)="performAction(action, row, $event)">
                <app-icon [name]="action.icon" size="16"></app-icon>
                {{ action.label }}
              </button>
            </div>
          </details>
        </td>
      </tr>
    </tbody>
  </table>
</div>
