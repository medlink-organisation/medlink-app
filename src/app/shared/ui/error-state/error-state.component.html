<section class="flex min-h-52 flex-col items-center justify-center rounded-[var(--ml-radius-lg)] border border-[var(--ml-border)] bg-[var(--ml-surface)] px-6 py-10 text-center">
  <span class="mb-4 grid size-11 place-items-center rounded-full bg-[var(--ml-danger-soft)] text-[var(--ml-danger)]">
    <app-icon name="circle-alert" size="22"></app-icon>
  </span>
  <h2 class="mb-0 text-base font-semibold">{{ title }}</h2>
  <p class="mt-2 mb-0 max-w-md text-sm text-[var(--ml-text-muted)]">{{ description }}</p>
  <app-button *ngIf="actionLabel" class="mt-5" variant="outline" (click)="action.emit()">
    <app-icon name="refresh" size="16"></app-icon>
    {{ actionLabel }}
  </app-button>
</section>
