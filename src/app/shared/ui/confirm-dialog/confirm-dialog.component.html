<ng-template #dialogTemplate>
  <div hlmDialogHeader>
    <h2 hlmDialogTitle>{{ title }}</h2>
    <p hlmDialogDescription>{{ message }}</p>
  </div>
  <div hlmDialogFooter>
    <app-button variant="outline" [disabled]="loading" (click)="onCancel()">{{ cancelLabel }}</app-button>
    <app-button [variant]="confirmVariant" [loading]="loading" (click)="onConfirm()">{{ confirmLabel }}</app-button>
  </div>
</ng-template>
