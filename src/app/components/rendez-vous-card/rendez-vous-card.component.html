<app-card>
  <div class="flex flex-wrap items-start justify-between gap-4">
    <div>
      <h3 class="font-semibold">Rendez-vous {{ rendezVous.id }}</h3>
      <p class="mt-1 text-sm text-muted-foreground">{{ rendezVous.type }} · Créneau {{ rendezVous.creneauId }}</p>
      <p class="text-sm text-muted-foreground">Patient {{ rendezVous.patientId }}</p>
    </div>
    <app-status-badge [value]="rendezVous.status ?? ''"></app-status-badge>
  </div>
  <div class="mt-4 flex flex-wrap gap-2" *ngIf="rendezVous.status === 'EN_ATTENTE'">
    <app-button size="sm" (click)="emitAction('confirmer')">Confirmer</app-button>
    <app-button size="sm" variant="outline" (click)="emitAction('annuler')">Annuler</app-button>
  </div>
  <div class="mt-4 flex flex-wrap gap-2" *ngIf="rendezVous.status === 'CONFIRME'">
    <app-button size="sm" (click)="emitAction('terminer')">Terminer</app-button>
    <app-button size="sm" variant="outline" (click)="emitAction('absent')">Absent</app-button>
    <app-button size="sm" variant="outline" (click)="emitAction('reporter')">Reporter</app-button>
  </div>
</app-card>
