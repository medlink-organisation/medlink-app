<app-form [formGroup]="formGroup" (submitted)="submit()">
  <div class="grid gap-4 md:grid-cols-2">
    <app-form-field label="Nom" [required]="true" [error]="errorFor('nom')">
      <input appFormControl formControlName="nom" autocomplete="family-name" />
    </app-form-field>
    <app-form-field label="Prénom" [required]="true" [error]="errorFor('prenom')">
      <input appFormControl formControlName="prenom" autocomplete="given-name" />
    </app-form-field>
    <app-form-field label="E-mail" [required]="true" [error]="errorFor('email')">
      <input appFormControl formControlName="email" type="email" autocomplete="email" />
    </app-form-field>
    <app-form-field label="Téléphone" [required]="true" [error]="errorFor('phone')">
      <input appFormControl formControlName="phone" type="tel" autocomplete="tel" />
    </app-form-field>
    <app-form-field label="Numéro d'ordre" [required]="true" [error]="errorFor('numeroOrdre')">
      <input appFormControl formControlName="numeroOrdre" />
    </app-form-field>
    <app-form-field label="Spécialité" [required]="true" [error]="errorFor('specialiteId')">
      <select appFormControl formControlName="specialiteId" [disabled]="referenceDataLoading || specialites.length === 0">
        <option value="">Choisir une spécialité</option>
        <option *ngFor="let specialite of specialites" [value]="specialite.id">{{ specialite.nom }}</option>
      </select>
      <p *ngIf="referenceDataLoading" class="mt-1 text-sm text-[var(--ml-text-muted)]">Chargement des spécialités…</p>
      <p *ngIf="!referenceDataLoading && specialites.length === 0" class="mt-1 text-sm text-[var(--ml-warning)]">Aucune spécialité disponible.</p>
    </app-form-field>
  </div>
  <section *ngIf="isCreating" class="mt-6" aria-labelledby="assigned-clinics-title">
    <div class="mb-3">
      <h3 id="assigned-clinics-title" class="text-base font-semibold">Cliniques affectées</h3>
      <p class="text-sm text-[var(--ml-text-muted)]">Sélectionnez une ou plusieurs cliniques.</p>
    </div>
    <app-alert *ngIf="referenceDataError" variant="destructive" title="Référentiel indisponible">{{ referenceDataError }}</app-alert>
    <div *ngIf="referenceDataLoading" class="grid gap-3 md:grid-cols-2">
      <app-skeleton *ngFor="let item of [1, 2, 3]" pattern="card" [rows]="3"></app-skeleton>
    </div>
    <div *ngIf="!referenceDataLoading && cliniques.length" class="grid gap-3 md:grid-cols-2">
      <app-selection-card
        *ngFor="let clinique of cliniques"
        [title]="clinique.nom ?? 'Clinique'"
        [description]="clinique.ville ?? ''"
        [meta]="clinique.adresse ?? ''"
        [multiple]="true"
        [selected]="isClinicSelected(clinique.id)"
        [disabled]="loading"
        (selectionChange)="toggleClinic(clinique.id, $event)">
      </app-selection-card>
    </div>
    <app-empty-state *ngIf="!referenceDataLoading && !referenceDataError && cliniques.length === 0" title="Aucune clinique disponible" description="Ajoutez d’abord une clinique au répertoire."></app-empty-state>
    <p *ngIf="errorFor('cliniqueIds')" class="mt-2 text-sm text-[var(--ml-danger)]">{{ errorFor('cliniqueIds') }}</p>
  </section>
  <div class="mt-5 flex justify-end gap-3">
    <app-button variant="outline" [disabled]="loading" (click)="cancelled.emit()">Annuler</app-button>
    <app-button type="submit" [loading]="loading" [disabled]="loading || referenceDataLoading || !!referenceDataError">Enregistrer</app-button>
  </div>
</app-form>
